<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ACOS Login Style Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --purple: #210b2c;
        --purple-soft: #2e1b3b;
        --wisteria: #bc96e6;
        --lavender: #d9c9ec;
        --sunglow: #ffd166;
        --ink: #f9f7fc;
        --muted: #bdb3c8;
        --line: #4a3b58;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--purple);
        color: var(--ink);
        font-family: "Noto Sans Thai", "Segoe UI", Arial, sans-serif;
      }

      .page {
        display: grid;
        min-height: 100vh;
        grid-template-columns: minmax(300px, 0.92fr) minmax(420px, 1.08fr);
      }

      .visual {
        position: relative;
        min-height: 680px;
        overflow: hidden;
        background: #342044 url("./login-bg.jpg") center / cover no-repeat;
      }

      .visual::after {
        position: absolute;
        inset: 0;
        background: rgb(33 11 44 / 0.44);
        content: "";
      }

      .visual-content {
        position: relative;
        z-index: 1;
        display: flex;
        min-height: 100%;
        flex-direction: column;
        justify-content: space-between;
        padding: 34px clamp(28px, 5vw, 76px);
      }

      .brand {
        margin: 0;
        color: #fff;
        font-size: clamp(1.8rem, 3vw, 2.8rem);
        font-weight: 400;
        letter-spacing: 0;
      }

      .brand strong { color: var(--sunglow); font-weight: 800; }

      .back-link {
        align-self: flex-end;
        border: 1px solid rgb(255 255 255 / 0.22);
        border-radius: 999px;
        padding: 8px 14px;
        color: var(--ink);
        font-size: 0.74rem;
        text-decoration: none;
      }

      .visual-copy { max-width: 370px; padding-bottom: 24px; }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--sunglow);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3.3vw, 3rem);
        line-height: 1.12;
      }

      .visual-copy p:last-child {
        margin: 18px 0 0;
        color: rgb(255 255 255 / 0.78);
        font-size: 0.96rem;
        line-height: 1.8;
      }

      .progress {
        display: flex;
        gap: 8px;
        margin-top: 28px;
      }

      .progress span {
        display: block;
        width: 24px;
        height: 3px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.36);
      }

      .progress span:last-child { width: 36px; background: var(--sunglow); }

      .form-side {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--purple);
        padding: 48px clamp(28px, 7vw, 112px);
      }

      .form-wrap { width: min(100%, 470px); }

      .language {
        display: block;
        margin: 0 0 72px auto;
        border: 0;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      h2 { margin: 0; color: var(--sunglow); font-size: clamp(1.8rem, 3vw, 2.7rem); }

      .account-link {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 0.86rem;
        text-align: center;
      }

      .account-link a { color: var(--lavender); font-weight: 800; }

      form { display: grid; gap: 18px; }

      label { display: grid; gap: 8px; color: var(--muted); font-size: 0.82rem; }

      input {
        width: 100%;
        height: 50px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--purple-soft);
        color: var(--ink);
        padding: 0 15px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgb(188 150 230 / 0.28);
        border-color: var(--wisteria);
      }

      .primary {
        height: 50px;
        margin-top: 8px;
        border: 0;
        border-radius: 6px;
        background: var(--wisteria);
        color: var(--purple);
        font: inherit;
        font-weight: 800;
      }

      .primary:hover { background: var(--sunglow); }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 28px 0 20px;
        color: var(--muted);
        font-size: 0.76rem;
      }

      .divider::before,
      .divider::after { flex: 1; height: 1px; background: var(--line); content: ""; }

      .secondary {
        width: 100%;
        height: 46px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-weight: 700;
      }

      @media (max-width: 820px) {
        .page { display: block; }
        .visual { min-height: 360px; }
        .visual-content { min-height: 360px; padding: 24px; }
        .visual-copy { padding-bottom: 0; }
        .visual-copy p:last-child { margin-top: 12px; }
        .form-side { padding: 44px 24px 56px; }
        .language { margin-bottom: 42px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="visual" aria-label="ACOS brand preview">
        <div class="visual-content">
          <div>
            <p class="brand"><strong>ADORA</strong> ACOS</p>
            <a class="back-link" href="#">กลับเว็บไซต์ →</a>
          </div>
          <div class="visual-copy">
            <p class="eyebrow">Commerce trust</p>
            <h1>สร้างความสัมพันธ์ที่ดีให้ทุกคำสั่งซื้อ</h1>
            <p>ระบบ commerce ที่ช่วยให้ทีมของคุณทำงานได้ชัดเจน ปลอดภัย และเติบโตไปพร้อมกับลูกค้า</p>
            <div class="progress" aria-hidden="true"><span></span><span></span><span></span></div>
          </div>
        </div>
      </section>

      <section class="form-side" aria-label="ACOS login preview">
        <div class="form-wrap">
          <button class="language" type="button">ENGLISH ▾</button>
          <h2>เข้าสู่ระบบ</h2>
          <form>
            <label>
              อีเมลหรือรหัสพนักงาน
              <input type="email" placeholder="admin@example.com" />
            </label>
            <button class="primary" type="button">ส่งลิงก์เข้าสู่ระบบ</button>
          </form>
          <div class="divider">หรือ</div>
          <button class="secondary" type="button">เข้าสู่ระบบด้วยบัญชีองค์กร</button>
          <p class="account-link">ยังไม่มีบัญชี? <a href="#">สร้างบัญชี</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
